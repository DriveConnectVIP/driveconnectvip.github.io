<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveConnect VIP | Advanced Network Search</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }
        .vip-gold {
            color: #d97706;
        }
        /* Fixed top spacing so content doesn't hide behind the sticky header */
        .advanced-container {
            max-width: 1000px;
            margin: 120px auto 40px auto;
            padding: 0 20px;
        }
        .search-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            color: #f8fafc;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
        }
        .form-group input, .form-group select {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3b82f6;
        }
        .action-bar {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            grid-column: 1 / -1;
        }
        .btn-primary {
            flex: 1;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-secondary {
            background: #334155;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            text-align: center;
        }
        .btn-secondary:hover {
            background: #475569;
        }
    </style>
</head>
<body style="background: #090d16; color: #f8fafc; font-family: 'Montserrat', sans-serif; margin: 0;">
    <header class="main-header glass-nav" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #0f172a; border-bottom: 1px solid #1e293b; position: fixed; top: 0; left: 0; right: 0; z-index: 1000;">
        <div class="brand-container">
            <img src="logo.png" alt="DriveConnect Logo" class="header-logo" onerror="this.style.display='none'">
            <div class="logo" style="font-weight: 900; font-size: 20px; letter-spacing: 1px;">DRIVECONNECT <span class="vip-gold">VIP</span></div>
        </div>
        <nav>
            <ul class="nav-links" style="display: flex; align-items: center; list-style: none; gap: 20px; margin: 0; padding: 0;">
                <li><a href="index.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#cbd5e1'">INVENTORY</a></li>
                <li><a href="perks.html" style="color: #cbd5e1; text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#cbd5e1'">DEALER PERKS</a></li>
            </ul>
        </nav>
    </header>

    <main class="advanced-container">
        <div style="margin-bottom: 25px;">
            <a href="index.html" style="color: #3b82f6; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Back to Showroom
            </a>
            <h1 style="font-size: 2rem; margin-top: 10px; color: #f8fafc;">Advanced Network Search</h1>
            <p style="color: #94a3b8; font-size: 0.95rem;">Filter across all specific inventory criteria for precise partner allocations.</p>
        </div>

        <div class="search-panel">
            <form id="advanced-search-form" onsubmit="handleAdvancedSearch(event)">
                <div class="form-grid">
                    <!-- Make -->
                    <div class="form-group">
                        <label for="adv-make">Make</label>
                        <input type="text" id="adv-make" placeholder="e.g. Ford, Chevrolet">
                    </div>
                    <!-- Model -->
                    <div class="form-group">
                        <label for="adv-model">Model</label>
                        <input type="text" id="adv-model" placeholder="e.g. Escape, Camaro">
                    </div>
                    <!-- Trim -->
                    <div class="form-group">
                        <label for="adv-trim">Trim</label>
                        <input type="text" id="adv-trim" placeholder="e.g. Titanium, 2SS">
                    </div>
                    <!-- Year -->
                    <div class="form-group">
                        <label for="adv-year">Year</label>
                        <input type="number" id="adv-year" placeholder="e.g. 2024">
                    </div>
                    <!-- DealerID -->
                    <div class="form-group">
                        <label for="adv-dealerid">Dealer ID</label>
                        <input type="text" id="adv-dealerid" placeholder="e.g. DLR-101">
                    </div>
                    <!-- Price -->
                    <div class="form-group">
                        <label for="adv-price">Max Price ($)</label>
                        <input type="number" id="adv-price" placeholder="e.g. 45000">
                    </div>
                    <!-- Transmission -->
                    <div class="form-group">
                        <label for="adv-transmission">Transmission</label>
                        <input type="text" id="adv-transmission" placeholder="e.g. Automatic, Manual">
                    </div>
                    <!-- Drivetrain -->
                    <div class="form-group">
                        <label for="adv-drivetrain">Drivetrain</label>
                        <input type="text" id="adv-drivetrain" placeholder="e.g. AWD, RWD, FWD">
                    </div>
                    <!-- Motor -->
                    <div class="form-group">
                        <label for="adv-motor">Motor / Engine</label>
                        <input type="text" id="adv-motor" placeholder="e.g. 2.0L EcoBoost, V8">
                    </div>
                    <!-- Condition -->
                    <div class="form-group">
                        <label for="adv-condition">Condition</label>
                        <select id="adv-condition">
                            <option value="">All Network Conditions</option>
                            <option value="New">New</option>
                            <option value="Used">Used</option>
                            <option value="Certified Pre-Owned">Certified Pre-Owned</option>
                        </select>
                    </div>
                    <!-- Mileage -->
                    <div class="form-group">
                        <label for="adv-mileage">Max Mileage</label>
                        <input type="number" id="adv-mileage" placeholder="e.g. 30000">
                    </div>
                    <!-- MPG -->
                    <div class="form-group">
                        <label for="adv-mpg">MPG / Efficiency</label>
                        <input type="text" id="adv-mpg" placeholder="e.g. 28 City / 34 Hwy">
                    </div>
                    <!-- ExteriorColor -->
                    <div class="form-group">
                        <label for="adv-extcolor">Exterior Color</label>
                        <input type="text" id="adv-extcolor" placeholder="e.g. Shadow Black, Red">
                    </div>
                    <!-- InteriorColor -->
                    <div class="form-group">
                        <label for="adv-intcolor">Interior Color</label>
                        <input type="text" id="adv-intcolor" placeholder="e.g. Ebony Black, Tan">
                    </div>

                    <div class="action-bar">
                        <button type="submit" class="btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Search Network Inventory</button>
                        <a href="advanced-search.html" class="btn-secondary">Reset</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer style="margin-top: 80px; padding: 30px 20px; background: #0f172a; border-top: 1px solid #1e293b; text-align: center; color: #94a3b8; font-size: 0.9rem;">
        <p>&copy; 2026 DriveConnect VIP. All rights reserved.</p>
    </footer>

    <script>
        function handleAdvancedSearch(event) {
            event.preventDefault();

            const params = new URLSearchParams();
            const fields = [
                'make', 'model', 'trim', 'year', 'dealerid',
                'price', 'transmission', 'drivetrain', 'motor',
                'condition', 'mileage', 'mpg', 'extcolor', 'intcolor'
            ];

            fields.forEach(field => {
                const inputEl = document.getElementById(`adv-${field}`);
                if (inputEl && inputEl.value.trim() !== "") {
                    params.append(field, inputEl.value.trim());
                }
            });

            // Passes parameters to index.html where Supabase query filters can read them
            window.location.href = `index.html?${params.toString()}`;
        }
    </script>
</body>
</html>
