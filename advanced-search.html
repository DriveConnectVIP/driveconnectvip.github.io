<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveConnect VIP | Network-Wide Advanced Search</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #0f172a;
            --border-color: #334155;
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: var(--bg-card); border: 1px solid var(--border-color); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="glass-card border-x-0 border-t-0 py-4 px-6 flex justify-between items-center sticky top-0 z-40">
        <a href="index.html" class="flex items-center space-x-2 text-sm font-bold text-white hover:text-[var(--accent-cyan)] transition-colors">
            <i class="fa-solid fa-shield-car text-[var(--accent-cyan)]"></i>
            <span>DRIVECONNECT <span class="text-blue-500">VIP</span></span>
        </a>
        <div class="flex items-center space-x-4 text-xs font-semibold">
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-house mr-1"></i> Showroom</a>
            <a href="manager-crm.html" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-user-gear mr-1"></i> Dealer Portal</a>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6">

        <!-- Page Header Banner -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900/60 p-6 rounded-2xl border border-slate-800">
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-[var(--accent-cyan)]"></i> Advanced Inventory Search
                </h1>
                <p class="text-xs text-[var(--text-muted)] mt-1">Cross-reference active allocation pools, dealership perks, and vehicle specs across our entire network.</p>
            </div>
            <div class="flex items-center gap-2 text-xs text-emerald-400 bg-emerald-950/60 px-3 py-1.5 rounded-full border border-emerald-800">
                <i class="fa-solid fa-circle text-[6px]"></i> Live Network Inventory Synced
            </div>
        </div>

        <!-- Search & Filter Controls Grid -->
        <section class="glass-card p-6 rounded-2xl space-y-4 border border-[var(--border-color)]">
            <form id="search-form" onsubmit="handleSearchSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

                    <!-- Keyword / Free-Text Query -->
                    <div class="space-y-1 md:col-span-2">
                        <label class="text-xs font-semibold text-slate-300">Keyword / Model Search</label>
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="filter-keyword" placeholder="e.g., Mustang, Dark Horse, AMG, AWD..." class="w-full pl-9 pr-3 py-2.5 bg-[#1e293b] border border-[var(--border-color)] rounded-xl text-white text-xs focus:outline-none focus:border-[var(--accent-cyan)]">
                        </div>
                    </div>

                    <!-- Make Filter -->
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">Make</label>
                        <select id="filter-make" class="w-full p-2.5 bg-[#1e293b] border border-[var(--border-color)] rounded-xl text-white text-xs focus:outline-none focus:border-[var(--accent-cyan)]">
                            <option value="">All Makes</option>
                            <option value="Ford">Ford</option>
                            <option value="Porsche">Porsche</option>
                            <option value="Mercedes-Benz">Mercedes-Benz</option>
                            <option value="BMW">BMW</option>
                            <option value="Subaru">Subaru</option>
                            <option value="Tesla">Tesla</option>
                            <option value="Acura">Acura</option>
                            <option value="Chevrolet">Chevrolet</option>
                        </select>
                    </div>

                    <!-- Max Price Filter -->
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300">Max Budget / Price</label>
                        <select id="filter-max-price" class="w-full p-2.5 bg-[#1e293b] border border-[var(--border-color)] rounded-xl text-white text-xs focus:outline-none focus:border-[var(--accent-cyan)]">
                            <option value="">No Price Limit</option>
                            <option value="35000">Under $35,000</option>
                            <option value="50000">Under $50,000</option>
                            <option value="75000">Under $75,000</option>
                            <option value="100000">Under $100,000</option>
                            <option value="150000">Under $150,000</option>
                            <option value="200000">Under $200,000</option>
                        </select>
                    </div>

                </div>

                <!-- Action Button Row -->
                <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                    <button type="button" onclick="resetFilters()" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center gap-1.5">
                        <i class="fa-solid fa-arrows-rotate"></i> Reset Filters
                    </button>
                    <button type="submit" class="bg-[var(--accent-blue)] hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-filter"></i> Apply Filters
                    </button>
                </div>
            </form>
        </section>

        <!-- Search Results Listing Section -->
        <section class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <span id="results-count" class="text-xs font-bold text-slate-400 uppercase tracking-wider">Matching Vehicles (0)</span>
                <span id="active-filter-badge" class="text-xs text-[var(--accent-cyan)] bg-blue-950/60 px-3 py-1 rounded-full border border-blue-800 hidden">Filtered view</span>
            </div>

            <!-- Vehicle Cards Grid -->
            <div id="vehicle-results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loaded dynamically -->
            </div>
        </section>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        const SHOWROOM_API_URL = "https://script.google.com/macros/s/AKfycbyqnBPGwjy1ElWDC-G-DPMYS8G3xPGZo0WLAvnN1tTm1PUrWN9SWvgCI-gbz9J9IAh2/exec";

        let masterInventory = [];

        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Extract URL Parameters immediately on load
            const urlParams = new URLSearchParams(window.location.search);
            const queryMake = urlParams.get('make') || urlParams.get('Make') || '';
            const queryKeyword = urlParams.get('keyword') || urlParams.get('vehicle') || urlParams.get('query') || '';
            const queryMaxPrice = urlParams.get('maxPrice') || urlParams.get('price') || '';

            // 2. Pre-fill filter controls with query values
            if (queryMake) document.getElementById('filter-make').value = queryMake;
            if (queryKeyword) document.getElementById('filter-keyword').value = queryKeyword;
            if (queryMaxPrice) document.getElementById('filter-max-price').value = queryMaxPrice;

            // 3. Load Master Data from backend endpoint
            await loadNetworkInventory();

            // 4. Run initial filter against parsed parameters
            applyFilters();
        });

        // Robust JSONP Fetch Helper to bypass CORS restrictions
        function fetchJsonp(url, callbackName) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(data);
                };
                script.onerror = function(err) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    reject(err);
                };
                script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
                document.body.appendChild(script);
            });
        }

        async function loadNetworkInventory() {
            try {
                const cbName = 'handleInvFetch_' + Math.floor(Math.random() * 100000);
                const data = await fetchJsonp(`${SHOWROOM_API_URL}`, cbName);

                if (data && data.inventory && Array.isArray(data.inventory)) {
                    masterInventory = data.inventory;
                } else {
                    useFallbackInventory();
                }
            } catch (err) {
                console.warn("Using local catalog fallback due to network response:", err);
                useFallbackInventory();
            }
        }

        function useFallbackInventory() {
            masterInventory = [
                { Year: "2024", Make: "Ford", Model: "Mustang Dark Horse", Trim: "V8 Premium", Price: 64500, Mileage: 1200, Dealer: "Northshore Exotic Motors", ImageURL: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?auto=format&fit=crop&w=800&q=80", DealerPerk: "Complimentary 3-Year Maintenance Plan" },
                { Year: "2023", Make: "Porsche", Model: "911 Carrera S", Trim: "PDK", Price: 134500, Mileage: 4800, Dealer: "Metro Luxury Motors", ImageURL: "https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&w=800&q=80", DealerPerk: "Track Day Pass & VIP Ceramic Coating" },
                { Year: "2024", Make: "Mercedes-Benz", Model: "G-Class G 63 AMG", Trim: "Bi-Turbo", Price: 185000, Mileage: 2100, Dealer: "Metro Luxury Motors", ImageURL: "https://images.unsplash.com/photo-1520050206274-a1ae44613e6d?auto=format&fit=crop&w=800&q=80", DealerPerk: "Free Enclosed Home Delivery" },
                { Year: "2024", Make: "BMW", Model: "M4 Competition", Trim: "xDrive", Price: 78900, Mileage: 3400, Dealer: "Granite State Auto Group", ImageURL: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80", DealerPerk: "1-Year VIP Tire & Wheel Protection" },
                { Year: "2024", Make: "Subaru", Model: "WRX Limited", Trim: "6-Speed Manual", Price: 36500, Mileage: 500, Dealer: "Granite State Auto Group", ImageURL: "https://images.unsplash.com/photo-1626668891365-27a961cb2fb9?auto=format&fit=crop&w=800&q=80", DealerPerk: "Complimentary All-Weather Package" }
            ];
        }

        function handleSearchSubmit(e) {
            e.preventDefault();
            applyFilters();
        }

        function applyFilters() {
            const selectedMake = (document.getElementById('filter-make').value || '').trim().toLowerCase();
            const keyword = (document.getElementById('filter-keyword').value || '').trim().toLowerCase();
            const maxPrice = Number(document.getElementById('filter-max-price').value || 0);

            const filtered = masterInventory.filter(car => {
                const carMake = String(car.Make || car.make || '').toLowerCase();
                const carModel = String(car.Model || car.model || '').toLowerCase();
                const carTrim = String(car.Trim || car.trim || '').toLowerCase();
                const carYear = String(car.Year || car.year || '').toLowerCase();
                const fullTitle = `${carYear} ${carMake} ${carModel} ${carTrim}`;

                const rawPrice = Number(car.Price || car.price || 0);

                // 1. Make Filter
                if (selectedMake && !carMake.includes(selectedMake) && !fullTitle.includes(selectedMake)) {
                    return false;
                }

                // 2. Keyword Filter
                if (keyword && !fullTitle.includes(keyword) && !carModel.includes(keyword)) {
                    return false;
                }

                // 3. Max Price Filter
                if (maxPrice > 0 && rawPrice > maxPrice) {
                    return false;
                }

                return true;
            });

            renderResults(filtered);

            // Toggle active filter badge
            const badge = document.getElementById('active-filter-badge');
            if (selectedMake || keyword || maxPrice > 0) {
                badge.classList.remove('hidden');
                badge.textContent = `Active Filters (${filtered.length} matched)`;
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderResults(inventory) {
            const grid = document.getElementById('vehicle-results-grid');
            const countElem = document.getElementById('results-count');

            countElem.textContent = `Matching Vehicles (${inventory.length})`;
            grid.innerHTML = '';

            if (inventory.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full glass-card p-12 text-center rounded-2xl space-y-3">
                        <i class="fa-solid fa-car-side text-4xl text-slate-600"></i>
                        <h3 class="text-base font-bold text-white">No Matching Vehicles Found</h3>
                        <p class="text-xs text-slate-400 max-w-md mx-auto">We couldn't find any allocations matching your specific criteria. Try adjusting your price range or make selection.</p>
                        <button onclick="resetFilters()" class="bg-slate-800 hover:bg-slate-700 text-[var(--accent-cyan)] px-4 py-2 rounded-xl text-xs font-semibold border border-slate-700 mt-2 transition">
                            Reset Search Filters
                        </button>
                    </div>
                `;
                return;
            }

            inventory.forEach(car => {
                const year = car.Year || car.year || '';
                const make = car.Make || car.make || '';
                const model = car.Model || car.model || '';
                const trim = car.Trim || car.trim || '';
                const title = `${year} ${make} ${model} ${trim}`.trim();
                const price = Number(car.Price || car.price || 0);
                const dealer = car.Dealer || car.dealer || car.DealerName || 'Partner Dealer';
                const perk = car.DealerPerk || car.Perk || car.defaultPerk || 'Complimentary VIP Concierge Service';
                const photoUrl = (car.ImageURL && String(car.ImageURL).startsWith('http'))
                    ? car.ImageURL
                    : 'https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&w=800&q=80';

                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl overflow-hidden hover:border-[var(--accent-cyan)] transition-all flex flex-col justify-between shadow-lg";
                card.innerHTML = `
                    <div>
                        <div class="relative h-48 bg-slate-800 overflow-hidden">
                            <img src="${photoUrl}" alt="${title}" class="w-full h-full object-cover">
                            <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full border border-slate-700 text-xs font-extrabold text-emerald-400">
                                $${price > 0 ? price.toLocaleString() : 'Inquire'}
                            </div>
                        </div>
                        <div class="p-5 space-y-3">
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-[var(--accent-cyan)]">${dealer}</span>
                                <h3 class="text-base font-extrabold text-white mt-0.5">${title}</h3>
                            </div>
                            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                                <div class="text-slate-400"><i class="fa-solid fa-gift text-amber-400 mr-1.5"></i> <strong class="text-slate-200">Exclusive Perk:</strong></div>
                                <div class="text-slate-300 font-medium">${perk}</div>
                            </div>
                        </div>
                    </div>
                    <div class="p-5 pt-0">
                        <a href="index.html?vehicle=${encodeURIComponent(title)}&dealer=${encodeURIComponent(dealer)}" class="w-full bg-[var(--accent-blue)] hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow">
                            <i class="fa-solid fa-ticket"></i> Claim VIP Pass & Inquiry
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function resetFilters() {
            document.getElementById('filter-keyword').value = '';
            document.getElementById('filter-make').value = '';
            document.getElementById('filter-max-price').value = '';
            applyFilters();
        }
    </script>
</body>
</html>
